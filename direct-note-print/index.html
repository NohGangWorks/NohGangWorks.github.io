<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Direct Note Print</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: Canvas; color: CanvasText; }
    main { width: min(32rem, calc(100% - 3rem)); text-align: center; }
    h1 { font-size: 1.3rem; }
    p { color: GrayText; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>인쇄 문서를 여는 중…</h1>
    <p id="status">잠시만 기다려 주세요.</p>
  </main>
  <script src="relay.js"></script>
</body>
</html>
